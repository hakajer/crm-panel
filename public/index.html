<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müşteri Paneli</title>
<style>
  :root {
    --ink: #1B2430;
    --ink-soft: #3A4657;
    --paper: #F6F5F1;
    --card: #FFFFFF;
    --line: #E4E1D8;
    --gold: #C79A45;
    --gold-dark: #A67F35;
    --ok: #3D7A56;
    --warn: #B08A2E;
    --bad: #B0483F;
    --muted: #8A8578;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .hidden { display: none !important; }

  /* ---- LOGIN ---- */
  #login-view {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 36px 28px;
    width: 100%;
    max-width: 360px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .brand-mark {
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 2px;
    display: inline-block;
  }
  .brand-name { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  .login-box p.sub { color: var(--muted); font-size: 14px; margin: 4px 0 24px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button {
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .btn-primary {
    width: 100%;
    background: var(--ink);
    color: #fff;
    padding: 13px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--ink-soft); }
  #login-error {
    color: var(--bad);
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* ---- DASHBOARD ---- */
  header {
    background: var(--ink);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand-name { color: #fff; }
  header .who { font-size: 13px; color: #C9CDD4; }
  header .logout {
    background: transparent;
    border: 1px solid #4A5566;
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  header .logout:hover { background: #2A3444; }

  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .stat-card:hover { border-color: var(--gold); }
  .stat-card.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .stat-num { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .toolbar input {
    margin-bottom: 0;
    flex: 1;
  }

  .lead-list { display: flex; flex-direction: column; gap: 10px; }
  .lead-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--muted);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .lead-card[data-status="ilgilendi"] { border-left-color: var(--ok); }
  .lead-card[data-status="dusunuyor"] { border-left-color: var(--warn); }
  .lead-card[data-status="ilgilenmedi"],
  .lead-card[data-status="ulasimadi"] { border-left-color: var(--bad); }
  .lead-card[data-status="bekliyor"] { border-left-color: var(--gold); }

  .lead-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .lead-name { font-weight: 700; font-size: 16px; }
  .lead-phone { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .lead-date { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .lead-details {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .lead-details b { color: var(--ink); font-weight: 600; }

  .status-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .status-btn {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .status-btn.selected { background: var(--ink); color: #fff; border-color: var(--ink); }

  .note-area {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .note-area textarea {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    min-height: 36px;
    background: var(--paper);
    color: var(--ink);
  }
  .note-save {
    background: var(--gold);
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .note-save:hover { background: var(--gold-dark); }
  .note-saved-tag {
    font-size: 11px;
    color: var(--ok);
    margin-left: 8px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .conversion-line {
    font-size: 13px;
    color: var(--ink-soft);
    margin: -8px 0 16px;
  }
  .conversion-line b { color: var(--gold-dark); }

  .toolbar .export-btn {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 0 16px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }
  .toolbar .export-btn:hover { border-color: var(--gold); color: var(--gold-dark); }

  .waiting-badge {
    display: inline-block;
    background: #FBEAE8;
    color: var(--bad);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 12px;
    margin-top: 4px;
  }

  .next-reminder {
    font-size: 12px;
    color: var(--warn);
    margin-bottom: 10px;
  }

  .action-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .action-btn {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .action-btn:hover { border-color: var(--gold); color: var(--gold-dark); }

  .conversation-box {
    display: none;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 13px;
    max-height: 240px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .conversation-box.open { display: block; }
  .conversation-box .loading { color: var(--muted); }

  .inline-link {
    color: #2563EB;
    font-weight: 600;
    text-decoration: underline;
    word-break: break-all;
  }
  .inline-link:hover { color: #1D4ED8; }

  .trash-btn {
    border-color: #FCA5A5 !important;
    color: var(--bad) !important;
  }
  .trash-btn:hover {
    background: #FEE2E2 !important;
  }
  .restore-btn {
    border-color: #86EFAC !important;
    color: var(--ok) !important;
  }
  .restore-btn:hover {
    background: #DCFCE7 !important;
  }
  .trash-banner {
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    color: var(--bad);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  /* ---- MODALS ---- */
  .modal-backdrop {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    width: 100%;
    max-width: 520px;
    padding: 24px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-title { font-weight: 700; font-size: 18px; }
  .modal-close {
    background: transparent;
    border: none;
    font-size: 22px;
    color: var(--muted);
    cursor: pointer;
  }
  .modal-close:hover { color: var(--ink); }
  .header-btn {
    background: #2A3444;
    border: 1px solid #4A5566;
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .header-btn:hover { background: #3A4657; }
  .user-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .user-table th, .user-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .user-table th { background: var(--paper); font-weight: 600; color: var(--ink-soft); }
  .role-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
  }
  .role-badge.admin { background: #FEF3C7; color: #92400E; }
  .role-badge.seller { background: #E0E7FF; color: #3730A3; }
  select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
    background: var(--paper);
    color: var(--ink);
  }
  .modal-msg {
    font-size: 13px;
    margin-top: 10px;
  }
  .modal-msg.error { color: var(--bad); }
  .modal-msg.success { color: var(--ok); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="login-view">
  <div class="login-box">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Müşteri Paneli</span></div>
    <p class="sub">Devam etmek için giriş yapın</p>
    <form id="login-form">
      <label>Telefon</label>
      <input type="text" id="login-phone" placeholder="05XXXXXXXXX" autocomplete="username" required>
      <label>Şifre</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Giriş Yap</button>
      <p id="login-error"></p>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-view" class="hidden">
  <header>
    <span class="brand-name">Müşteri Paneli</span>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="who" id="who-label"></span>
      <button class="header-btn hidden" id="users-btn">👥 Kullanıcılar</button>
      <button class="header-btn" id="pw-btn">🔑 Şifre Değiştir</button>
      <button class="logout" id="logout-btn">Çıkış</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="text" id="search-input" placeholder="İsim, telefon veya ilan/araç ara...">
      <button class="export-btn" id="export-btn">📊 Excel İndir</button>
    </div>
    <div class="conversion-line" id="conversion-line"></div>

    <div class="lead-list" id="lead-list"></div>
    <div class="empty-state hidden" id="empty-state">Kayıt bulunamadı.</div>
  </main>
</div>

<!-- MODAL: ŞİFRE DEĞİŞTİR -->
<div id="pw-modal" class="modal-backdrop hidden">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title">🔑 Şifre Değiştir</span>
      <button class="modal-close" id="pw-modal-close">&times;</button>
    </div>
    <form id="pw-form">
      <label>Mevcut Şifre</label>
      <input type="password" id="pw-current" required>
      <label>Yeni Şifre</label>
      <input type="password" id="pw-new" required minlength="8">
      <label>Yeni Şifre (Tekrar)</label>
      <input type="password" id="pw-confirm" required minlength="8">
      <button type="submit" class="btn-primary">Şifreyi Güncelle</button>
      <div id="pw-msg" class="modal-msg"></div>
    </form>
  </div>
</div>

<!-- MODAL: KULLANICI YÖNETİMİ (Sadece Admin) -->
<div id="users-modal" class="modal-backdrop hidden">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title">👥 Kullanıcı Yönetimi</span>
      <button class="modal-close" id="users-modal-close">&times;</button>
    </div>
    
    <div id="users-list-box">
      <table class="user-table">
        <thead>
          <tr>
            <th>Ad Soyad</th>
            <th>Telefon</th>
            <th>Yetki</th>
            <th>İşlem</th>
          </tr>
        </thead>
        <tbody id="user-table-body"></tbody>
      </table>
    </div>

    <hr style="border:0; border-top:1px solid var(--line); margin: 20px 0;">

    <form id="add-user-form">
      <div style="font-weight:700; margin-bottom:12px;">➕ Yeni Kullanıcı Ekle</div>
      <label>Ad Soyad</label>
      <input type="text" id="add-user-name" placeholder="Örn: Ahmet Yılmaz" required>
      <label>Telefon Numarası</label>
      <input type="text" id="add-user-phone" placeholder="05XXXXXXXXX" required>
      <label>Şifre</label>
      <input type="password" id="add-user-pw" required minlength="8">
      <label>Yetki (Rol)</label>
      <select id="add-user-role">
        <option value="seller">Personel (Satıcı)</option>
        <option value="admin">Yönetici (Admin)</option>
      </select>
      <button type="submit" class="btn-primary">Kullanıcıyı Kaydet</button>
      <div id="add-user-msg" class="modal-msg"></div>
    </form>
  </div>
</div>

<script>
const STATUS_LABELS = {
  bekliyor: 'Bekliyor',
  ilgilendi: 'İlgilendi',
  dusunuyor: 'Düşünüyor',
  ilgilenmedi: 'İlgilenmedi',
  ulasimadi: 'Ulaşamadı',
};
const STATUS_ORDER = ['ilgilendi', 'dusunuyor', 'ulasimadi', 'ilgilenmedi'];

let currentFilter = 'all';
let searchQuery = '';
let searchTimer = null;
let currentLeads = [];
let currentUser = null;

const loginView = document.getElementById('login-view');
const dashboardView = document.getElementById('dashboard-view');

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== '/api/login') {
    showLogin();
  }
  if (!res.ok) throw new Error(data.error || 'Beklenmeyen bir hata oluştu');
  return data;
}

function showLogin() {
  loginView.classList.remove('hidden');
  dashboardView.classList.add('hidden');
}

function showDashboard(me) {
  currentUser = me;
  loginView.classList.add('hidden');
  dashboardView.classList.remove('hidden');
  document.getElementById('who-label').textContent = me.name || me.phone;
  
  const usersBtn = document.getElementById('users-btn');
  if (me.role === 'admin') {
    usersBtn.classList.remove('hidden');
  } else {
    usersBtn.classList.add('hidden');
  }

  loadStats();
  loadLeads();
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = document.getElementById('login-phone').value;
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';
  try {
    const data = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ phone, password }),
    });
    showDashboard(data);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await api('/api/logout', { method: 'POST' });
  showLogin();
});

// ---- MODAL İŞLEMLERİ ----
const pwModal = document.getElementById('pw-modal');
const pwBtn = document.getElementById('pw-btn');
const pwClose = document.getElementById('pw-modal-close');
const pwMsg = document.getElementById('pw-msg');

pwBtn.addEventListener('click', () => {
  pwMsg.textContent = '';
  document.getElementById('pw-form').reset();
  pwModal.classList.remove('hidden');
});
pwClose.addEventListener('click', () => pwModal.classList.add('hidden'));

document.getElementById('pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const currentPassword = document.getElementById('pw-current').value;
  const newPassword = document.getElementById('pw-new').value;
  const confirmPassword = document.getElementById('pw-confirm').value;

  if (newPassword !== confirmPassword) {
    pwMsg.className = 'modal-msg error';
    pwMsg.textContent = 'Yeni şifreler eşleşmiyor';
    return;
  }

  try {
    await api('/api/change-password', {
      method: 'POST',
      body: JSON.stringify({ currentPassword, newPassword }),
    });
    pwMsg.className = 'modal-msg success';
    pwMsg.textContent = 'Şifreniz başarıyla güncellendi!';
    setTimeout(() => pwModal.classList.add('hidden'), 1500);
  } catch (err) {
    pwMsg.className = 'modal-msg error';
    pwMsg.textContent = err.message;
  }
});

const usersModal = document.getElementById('users-modal');
const usersBtn = document.getElementById('users-btn');
const usersClose = document.getElementById('users-modal-close');
const addMsg = document.getElementById('add-user-msg');

usersBtn.addEventListener('click', () => {
  addMsg.textContent = '';
  document.getElementById('add-user-form').reset();
  loadUsers();
  usersModal.classList.remove('hidden');
});
usersClose.addEventListener('click', () => usersModal.classList.add('hidden'));

async function loadUsers() {
  try {
    const users = await api('/api/users');
    const tbody = document.getElementById('user-table-body');
    tbody.innerHTML = users.map(u => `
      <tr>
        <td><b>${escapeHtml(u.name || '')}</b></td>
        <td>+${escapeHtml(u.phone || '')}</td>
        <td><span class="role-badge ${u.role === 'admin' ? 'admin' : 'seller'}">${u.role === 'admin' ? 'Yönetici' : 'Personel'}</span></td>
        <td>
          ${String(u.id) === String(currentUser.id)
            ? '<span style="color:var(--muted); font-size:11px;">(Siz)</span>'
            : `<button class="action-btn trash-btn delete-user-btn" data-id="${u.id}">Sil</button>`
          }
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('.delete-user-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (confirm('Bu kullanıcıyı silmek istediğinize emin misiniz?')) {
          try {
            await api(`/api/users/${btn.dataset.id}`, { method: 'DELETE' });
            loadUsers();
          } catch (err) {
            alert(err.message);
          }
        }
      });
    });
  } catch (err) {
    alert(err.message);
  }
}

document.getElementById('add-user-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('add-user-name').value;
  const phone = document.getElementById('add-user-phone').value;
  const password = document.getElementById('add-user-pw').value;
  const role = document.getElementById('add-user-role').value;

  try {
    await api('/api/users', {
      method: 'POST',
      body: JSON.stringify({ name, phone, password, role }),
    });
    addMsg.className = 'modal-msg success';
    addMsg.textContent = 'Kullanıcı eklendi!';
    document.getElementById('add-user-form').reset();
    loadUsers();
    setTimeout(() => addMsg.textContent = '', 2500);
  } catch (err) {
    addMsg.className = 'modal-msg error';
    addMsg.textContent = err.message;
  }
});

async function loadStats() {
  const stats = await api('/api/stats');
  const cards = [
    { key: 'all', label: 'Toplam', value: stats.toplam },
    { key: 'bekliyor', label: 'Bekliyor', value: stats.bekliyor },
    { key: 'ilgilendi', label: 'İlgilendi', value: stats.ilgilendi },
    { key: 'dusunuyor', label: 'Düşünüyor', value: stats.dusunuyor },
    { key: 'ilgilenmedi', label: 'İlgilenmedi', value: stats.ilgilenmedi },
    { key: 'ulasimadi', label: 'Ulaşamadı', value: stats.ulasimadi },
    { key: 'trash', label: '🗑️ Çöp Kutusu', value: stats.trash || 0 },
  ];
  const el = document.getElementById('stats');
  el.innerHTML = cards.map(c => `
    <div class="stat-card ${currentFilter === c.key ? 'active' : ''}" data-filter="${c.key}">
      <div class="stat-num">${c.value}</div>
      <div class="stat-label">${c.label}</div>
    </div>
  `).join('');
  el.querySelectorAll('.stat-card').forEach(card => {
    card.addEventListener('click', () => {
      currentFilter = card.dataset.filter;
      loadStats();
      loadLeads();
    });
  });

  const oran = stats.donusum_orani;
  const conversionEl = document.getElementById('conversion-line');
  conversionEl.textContent = (oran !== null && oran !== undefined)
    ? `📈 Dönüşüm oranı: ${oran}% (ilgilenen / toplam)`
    : '';
}

async function loadLeads() {
  const params = new URLSearchParams();
  if (currentFilter !== 'all') params.set('status', currentFilter);
  if (searchQuery) params.set('q', searchQuery);
  const leads = await api('/api/leads?' + params.toString());
  currentLeads = leads;
  renderLeads(leads);
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
}

function formatReminderTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diffMs = d - now;
  if (diffMs <= 0) return 'şimdi';
  const diffMin = Math.round(diffMs / 60000);
  if (diffMin < 60) return `${diffMin} dk sonra`;
  const diffHour = Math.round(diffMin / 60);
  if (diffHour < 24) return `${diffHour} saat sonra`;
  const diffDay = Math.round(diffHour / 24);
  return `${diffDay} gün sonra`;
}

function waitingDaysBadge(lead) {
  if (lead.deleted_at) return '';
  const status = lead.call_status || 'bekliyor';
  if (status !== 'bekliyor') return '';
  const days = Math.floor((Date.now() - new Date(lead.created_at)) / 86400000);
  if (days < 2) return '';
  return `<span class="waiting-badge">⚠️ ${days} gündür bekliyor</span>`;
}

function formatWithLinks(text) {
  if (!text || text === 'Belirtilmedi') return 'Belirtilmedi';
  const escaped = escapeHtml(text);
  const urlRegex = /(https?:\/\/[^\s<]+)/gi;
  return escaped.replace(urlRegex, (url) => {
    const label = url.length > 35 ? url.substring(0, 32) + '...' : url;
    return `<a href="${url}" target="_blank" rel="noopener" class="inline-link">🔗 İlanı Aç (${label})</a>`;
  });
}

function renderLeads(leads) {
  const list = document.getElementById('lead-list');
  const empty = document.getElementById('empty-state');
  if (leads.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  list.innerHTML = leads.map(lead => {
    const isDeleted = !!lead.deleted_at;
    const status = lead.call_status || 'bekliyor';
    const waPhone = (lead.phone || '').replace(/\D/g, '');
    return `
    <div class="lead-card" data-status="${isDeleted ? 'deleted' : status}" data-id="${lead.id}">
      ${isDeleted ? `<div class="trash-banner">🗑️ Çöp Kutusunda (Silinme: ${formatDate(lead.deleted_at)})</div>` : ''}
      <div class="lead-top">
        <div>
          <div class="lead-name">${escapeHtml(lead.customer_name || 'İsimsiz')}</div>
          <div class="lead-phone">+${escapeHtml(lead.phone || '')}</div>
          ${waitingDaysBadge(lead)}
        </div>
        <div class="lead-date">${formatDate(lead.created_at)}</div>
      </div>
      <div class="lead-details">
        <div>🏠 <b>${formatWithLinks(lead.ilan_arac)}</b></div>
        <div>💰 <b>${formatWithLinks(lead.butce)}</b></div>
        <div>🔄 <b>${formatWithLinks(lead.takas)}</b></div>
        <div>📅 <b>${formatWithLinks(lead.zaman)}</b></div>
      </div>
      ${lead.next_reminder && !isDeleted ? `<div class="next-reminder">⏰ Sonraki hatırlatma: ${formatReminderTime(lead.next_reminder)}</div>` : ''}
      <div class="action-row">
        <a class="action-btn" href="https://wa.me/${waPhone}" target="_blank" rel="noopener">💬 WhatsApp</a>
        <button class="action-btn conv-toggle-btn">🗨️ Konuşmayı Gör</button>
        ${isDeleted
          ? `<button class="action-btn restore-btn" data-id="${lead.id}">↩️ Geri Yükle</button>`
          : `<button class="action-btn trash-btn" data-id="${lead.id}">🗑️ Sil</button>`
        }
      </div>
      <div class="conversation-box"></div>
      ${!isDeleted ? `
      <div class="status-row">
        ${STATUS_ORDER.map(s => `
          <button class="status-btn ${status === s ? 'selected' : ''}" data-status="${s}">
            ${STATUS_LABELS[s]}
          </button>
        `).join('')}
      </div>
      <div class="note-area">
        <textarea placeholder="Not ekle...">${escapeHtml(lead.call_note || '')}</textarea>
        <button class="note-save">Kaydet</button>
        <span class="note-saved-tag">Kaydedildi</span>
      </div>
      ` : ''}
    </div>
  `;
  }).join('');

  list.querySelectorAll('.lead-card').forEach(card => {
    const id = card.dataset.id;

    card.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newStatus = btn.dataset.status;
        const isSelected = btn.classList.contains('selected');
        const valueToSend = isSelected ? null : newStatus;
        await api(`/api/leads/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ call_status: valueToSend }),
        });
        loadStats();
        loadLeads();
      });
    });

    const saveBtn = card.querySelector('.note-save');
    if (saveBtn) {
      const textarea = card.querySelector('textarea');
      const tag = card.querySelector('.note-saved-tag');
      saveBtn.addEventListener('click', async () => {
        await api(`/api/leads/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ call_note: textarea.value }),
        });
        tag.style.opacity = '1';
        setTimeout(() => tag.style.opacity = '0', 1500);
      });
    }

    const trashBtn = card.querySelector('.trash-btn');
    if (trashBtn) {
      trashBtn.addEventListener('click', async () => {
        if (confirm('Bu lead kaydını Çöp Kutusu\'na taşımak istediğinize emin misiniz?')) {
          await api(`/api/leads/${id}/trash`, { method: 'POST' });
          loadStats();
          loadLeads();
        }
      });
    }

    const restoreBtn = card.querySelector('.restore-btn');
    if (restoreBtn) {
      restoreBtn.addEventListener('click', async () => {
        await api(`/api/leads/${id}/restore`, { method: 'POST' });
        loadStats();
        loadLeads();
      });
    }

    const convBtn = card.querySelector('.conv-toggle-btn');
    const convBox = card.querySelector('.conversation-box');
    const lead = currentLeads.find(l => String(l.id) === String(id));
    convBtn.addEventListener('click', () => {
      const isOpen = convBox.classList.toggle('open');
      if (isOpen) {
        const snapshot = lead?.conversation_snapshot;
        convBox.innerHTML = snapshot
          ? formatWithLinks(snapshot)
          : '(Bu lead için konuşma özeti kaydedilmemiş)';
      }
    });
  });
}

async function exportLeadsExcel() {
  if (!currentLeads.length) return;

  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet('Leadler');

  sheet.columns = [
    { header: 'Ad', key: 'ad', width: 22 },
    { header: 'Telefon', key: 'telefon', width: 16 },
    { header: 'İlan / Araç', key: 'ilan', width: 28 },
    { header: 'Bütçe', key: 'butce', width: 18 },
    { header: 'Takas', key: 'takas', width: 18 },
    { header: 'Zaman Planı', key: 'zaman', width: 18 },
    { header: 'Durum', key: 'durum', width: 14 },
    { header: 'Not', key: 'not', width: 34 },
    { header: 'Oluşturulma Tarihi', key: 'tarih', width: 18 },
  ];

  currentLeads.forEach(l => {
    sheet.addRow({
      ad: l.customer_name || '',
      telefon: '+' + (l.phone || ''),
      ilan: l.ilan_arac || '',
      butce: l.butce || '',
      takas: l.takas || '',
      zaman: l.zaman || '',
      durum: STATUS_LABELS[l.call_status || 'bekliyor'] || '',
      not: l.call_note || '',
      tarih: formatDate(l.created_at),
    });
  });

  const headerRow = sheet.getRow(1);
  headerRow.height = 22;
  headerRow.eachCell(cell => {
    cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1B2430' } };
    cell.alignment = { vertical: 'middle', horizontal: 'left' };
  });
  sheet.views = [{ state: 'frozen', ySplit: 1 }];

  sheet.eachRow((row, rowNumber) => {
    row.eachCell(cell => {
      cell.border = {
        top: { style: 'thin', color: { argb: 'FFE4E1D8' } },
        bottom: { style: 'thin', color: { argb: 'FFE4E1D8' } },
        left: { style: 'thin', color: { argb: 'FFE4E1D8' } },
        right: { style: 'thin', color: { argb: 'FFE4E1D8' } },
      };
      cell.alignment = { vertical: 'middle', wrapText: true };
    });
    if (rowNumber > 1) {
      row.height = 20;
      if (rowNumber % 2 === 0) {
        row.eachCell(cell => {
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF6F5F1' } };
        });
      }
    }
  });

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `leadler_${new Date().toISOString().slice(0, 10)}.xlsx`;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('export-btn').addEventListener('click', exportLeadsExcel);

document.getElementById('search-input').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    loadLeads();
  }, 350);
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Uygulama açılışı
(async () => {
  try {
    const me = await api('/api/me');
    showDashboard(me);
  } catch {
    showLogin();
  }
})();
</script>
